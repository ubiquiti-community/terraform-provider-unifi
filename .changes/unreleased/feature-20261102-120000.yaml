kind: feature
body: '**`unifi_vpn_server`: `client_address` sets the "Alternate Address for Clients".** Client configurations the controller generates then use this host name or IP address as the endpoint instead of the WAN address, e.g. a DNS name for a server behind a fixed or dynamic address. go-unifi already modelled the fields, but the provider rebuilds the whole network on update and always sent the override as disabled, so a value set in the UI was reset by the next change to the server. Leaving it unset keeps that behaviour (the override is off)'
time: 2026-11-02T12:00:00Z

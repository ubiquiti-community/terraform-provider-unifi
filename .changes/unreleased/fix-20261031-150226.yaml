kind: fix
body: '**`unifi_wlan` no longer resets an imported SSID''s AP group, enabled/guest state or remaining toggles to the schema defaults.** The last static defaults on `unifi_wlan` are gone: 14 attributes (`is_guest`, `vlan_enabled`, `l2_isolation`, `proxy_arp`, `uapsd`, `fast_roaming_enabled`, `multicast_enhance`, `mlo_enabled`, `hotspot2conf_enabled`, `private_preshared_keys_enabled`, `nas_identifier_type`, `mac_filter.enabled`, `wpa3.fast_roaming`, `wpa3.enhanced_192`) now take the controller''s value when unset, and `enabled`, `ap_group`, `mac_filter.policy`, `minrate_setting_preference`, `wpa.mode` and `dtim_mode` keep their defaults for a newly created WLAN only. Before, importing an SSID without declaring `ap_group` planned clearing its `ap_group_ids`, and a partial `mac_filter` block flipped an `allow` policy to `deny`. (#680, part of #544)'
time: 2026-10-31T15:02:26.090955+01:00

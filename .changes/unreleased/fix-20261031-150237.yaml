kind: fix
body: '**`unifi_network` and `unifi_wan` no longer plan static defaults over the controller''s values.** An imported or adopted network no longer proposes re-enabling itself or its internet access, turning off IGMP snooping, isolation or DHCP guarding, or (when `dhcp_server` is declared without them) resetting the lease to 24h, re-enabling conflict checking and switching DHCP DNS/NTP/WINS off. An adopted WAN keeps its `type` (a PPPoE/static uplink was planned, and on adoption written, back to `dhcp`), its VLAN id, egress QoS, Smart Queue and enabled flag. Defaults that a new resource needs (`internet_access`, `dhcp_server.enabled`, `conflict_checking`, `leasetime`, `gateway_type`) now apply on create only. `egress_qos.enabled` is no longer sent as `false` when unset (#682, part of #544)'
time: 2026-10-31T15:02:37.669969+01:00

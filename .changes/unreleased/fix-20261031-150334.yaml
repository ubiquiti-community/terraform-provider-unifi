kind: fix
body: '**`unifi_radius_profile`, `unifi_radius_user`, `unifi_port_profile`, `unifi_power_supervisor`: static defaults no longer overwrite the controller''s values on adopted objects.** Importing the built-in RADIUS `Default` profile planned `use_usg_auth_server = true -> false`, moving it off the gateway''s RADIUS server. RADIUS users with a VLAN tunnel planned `tunnel.type` back to `3`. Server ports and tunnel types the controller stores as `""` (read as null since go-unifi v1.42.0) planned `null -> 1812` / `null -> 3` on every first apply. Attributes the controller always reports now come from it. Values that must be on the wire for a create (`autoneg`, `lldpmed.enabled`, the `dot1x`/`lldpmed`/`interim_update`/`vlan`/`tunnel` groups, the RADIUS server ports, the power supervisor settings) are applied to new objects only, and an existing object keeps the controller''s value, null included. New objects are created exactly as before (#684, part of #544)'
time: 2026-10-31T15:03:34.62861+01:00

kind: fix
body: '**VPN resources no longer overwrite an adopted tunnel with schema defaults.** `unifi_vpn_server`, `unifi_vpn_client`, `unifi_site_to_site_vpn` and `unifi_wireguard_peer` planned undeclared attributes back to static defaults, because the framework applies defaults before plan modifiers: a disabled tunnel was re-enabled, a `wan2` tunnel moved to `wan`, an IKEv1 tunnel switched to IKEv2, a server put back on port 51820/1194 or narrowed from v6 to v4, `wan.ip = "any"` written over a server storing none, and a peer''s `allowed_ips` cleared. Values the controller always supplies are now held from state; values a new tunnel has always been created with are applied on create only, so the create request is unchanged (#690, part of #544)'
time: 2026-10-31T15:03:57.712728+01:00

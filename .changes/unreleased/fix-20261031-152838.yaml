kind: fix
body: '**`unifi_firewall_policy` keeps an adopted IP/MAC binding and IPv6 interface ID match.** `match_mac`, `mac`, `iid` and `match_opposite_iid` drop their static defaults: a new policy is still created with `false`/empty, an existing one keeps the controller''s values while the endpoint''s `matching_target` is unchanged (switching the target resets them as before). `unifi_client_qos_rate` now accepts `qos_rate.max_up = -1` (unlimited), like `max_down`. New `unifi_vpn_server`, `unifi_vpn_client`, `unifi_site_to_site_vpn`, `unifi_static_route`, `unifi_qos_rule`, `unifi_content_filter` and `unifi_dns_record` resources now plan `enabled = true` instead of `(known after apply)`; the value sent is unchanged. (#693, part of #544)'
time: 2026-10-31T15:28:38.726457+01:00

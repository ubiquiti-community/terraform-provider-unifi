kind: fix
body: '**`unifi_setting`: `mdns.enabled_for = "some"` now applies on Network 11, and `mdns.enabled_for_network_ids` chooses the networks.** Network 11 keeps the mDNS network selection in the v2 global network settings. The `mdns` setting and each network''s `mdns_enabled` flag only mirror it there and the controller ignores writes to them, so the selection was never applied and read back as `all`. The provider now writes `enabled_for` and the network list to that object and sends its other keys back unchanged. `enabled_for_network_ids` is now Optional: left unset, the current selection is kept. Earlier controllers derive the list from `multicast_dns`, so there a list that differs from it is rejected before anything is written (#727, from #726)'
time: 2026-11-17T19:06:48.312193-05:00

kind: fix
body: '**`unifi_device`: a LAG port is written back with its `lag_idx`.** The controller numbers the link aggregation groups of a switch and reports the number as `lag_idx` on the lead port (`op_mode = "aggregate"`). go-unifi did not model the field, so a change to any port of a switch, which sends the whole `port_overrides` array, sent every LAG port without its number. It is now carried from the controller like the other fields the schema does not expose. Requires go-unifi with `lag_idx` in `DevicePortOverrides`'
time: 2026-11-19T07:50:51.536704473+01:00

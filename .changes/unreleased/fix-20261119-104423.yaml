kind: fix
body: '**`unifi_network`: the first update of an imported network stored without `setting_preference` no longer fails.** The controller writes `manual` when it next saves such a network (the built-in Default LAN on some installs), but the plan copied the null from state, so the apply failed with "inconsistent result after apply". A null prior value is now left unknown in the plan (from #723)'
time: 2026-11-19T10:44:23.759006-08:00

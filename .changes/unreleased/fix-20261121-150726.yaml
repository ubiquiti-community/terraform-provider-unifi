kind: fix
body: '**`unifi_device_port`, `unifi_device`: `tagged_networkconf_ids` now limits the tagged networks.** The controller (checked on UniFi Network 9.5.21, 10.0.162 and 11.0.103) drops the tagged list from a port override and keeps only `excluded_networkconf_ids`, and a `tagged_vlan_mgmt = "custom"` port tags every network that is not excluded. So the port tagged every network of the site, and `unifi_device_port` failed with "planned set element ... does not correlate with any element in actual". The provider now also writes the site''''s other LAN networks, except the port''''s native one, as excluded, and reads the tagged networks back from that list when the controller returns none; a network added to the site later shows up as drift. Setting both `tagged_networkconf_ids` and `excluded_networkconf_ids` on a port is now rejected at plan time (#737, from #735)'
time: 2026-11-21T15:07:26.521441489Z

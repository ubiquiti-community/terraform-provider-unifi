# Changelog fragment check.
#
# A PR that changes provider code (non-test Go files under unifi/, or main.go)
# should add a changelog fragment under .changes/unreleased/ (`go tool changie
# new`, see CONTRIBUTING.md). The fragments are assembled into CHANGELOG.md at
# release time, so PRs never conflict on CHANGELOG.md.
#
# Not a required check. Skipped for Dependabot (dependency bumps are collected
# by the maintainer at release time) and for PRs labelled `skip-changelog`
# (refactors, tests, CI-only changes). Adding or removing the label re-runs it.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment:
    name: Changelog fragment
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require a fragment when provider code changes
      run: |
        set -euo pipefail
        # status and filename of every file in the PR (the files API lists at
        # most 3000; a PR that large is checked on what it returns).
        files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
          --jq '.[] | "\(.status) \(.filename)"')"

        code="$(grep -E '^[a-z]+ ((unifi/.*\.go)|(main\.go))$' <<<"$files" \
          | grep -Ev '_test\.go$' || true)"
        if [ -z "$code" ]; then
          echo "No provider code change: no changelog fragment needed."
          exit 0
        fi

        fragments="$(grep -E '^(added|modified|renamed|copied|changed) \.changes/unreleased/[^/]+\.yaml$' <<<"$files" || true)"
        if [ -n "$fragments" ]; then
          echo "Changelog fragment(s):"
          awk '{ sub(/^[a-z]+ /, "  "); print }' <<<"$fragments"
          exit 0
        fi

        msg="This PR changes provider code but adds no changelog fragment under .changes/unreleased/. Run 'go tool changie new' (see CONTRIBUTING.md) and commit the file, or ask a maintainer to add the 'skip-changelog' label if the change needs no entry."
        echo "::error title=Missing changelog fragment::$msg"
        {
          echo "### Missing changelog fragment"
          echo
          echo "$msg"
          echo
          echo "Provider code changed:"
          echo
          awk '{ sub(/^[a-z]+ /, "- "); print }' <<<"$code"
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

  # CHANGELOG.md is generated by `go tool changie merge` from .changes/. An edit
  # made to CHANGELOG.md alone would be overwritten by the next release, so
  # check that it matches what changie generates whenever either side changes.
  in-sync:
    name: CHANGELOG.md in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - id: filter
      run: |
        set -euo pipefail
        files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
          --jq '.[] | .filename, (.previous_filename // empty)')"
        if grep -Eq '^((CHANGELOG\.md)|(\.changie\.yaml)|(\.changes/[^/]+\.md))$' <<<"$files"; then
          echo "check=true" >> "$GITHUB_OUTPUT"
        else
          echo "CHANGELOG.md and the released notes are untouched."
          echo "check=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - if: steps.filter.outputs.check == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - if: steps.filter.outputs.check == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - if: steps.filter.outputs.check == 'true'
      name: changie merge
      run: |
        go tool changie merge
        git diff --exit-code -- CHANGELOG.md || {
          echo "::error title=CHANGELOG.md out of sync::CHANGELOG.md does not match 'go tool changie merge'. Edit the released notes in .changes/vX.Y.Z.md (not CHANGELOG.md) and run 'go tool changie merge'."
          exit 1
        }

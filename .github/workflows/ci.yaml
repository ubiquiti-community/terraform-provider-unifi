# Terraform Provider testing workflow.
name: CI/CD

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
#
# Build and test are required checks on main, so every PR must report them. A
# `paths:` filter on pull_request would leave a PR that touches no Go code (a
# workflow bump, docs) without them, blocked for good. Instead CI/CD runs on
# every PR and the `changes` job skips the Go jobs when nothing Go changed; a
# job skipped by `if:` still satisfies a required check.
on:
  pull_request:
  push:
    branches:
    - "main"
    paths:
    - "**.go"
    - "go.mod"
    - "go.sum"
    - ".github/workflows/ci.yaml"

# contents: read is needed to check out the repository.
# id-token: write is needed for Codecov OIDC uploads.
# pull-requests: read lets the changes job list the PR's files.
permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
    - id: filter
      # A push to main only triggers on Go paths (see above), so it always
      # counts as a Go change. Keep ci_paths in sync with those push paths.
      run: |
        set -euo pipefail
        if [ "$EVENT" != "pull_request" ]; then
          echo "go=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        ci_paths='(\.go$)|(^go\.mod$)|(^go\.sum$)|(^\.github/workflows/ci\.yaml$)'
        # A rename counts under both names. A here-string, not `printf | grep -q`:
        # under pipefail the writer's SIGPIPE would read as no match.
        files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
          --jq '.[] | .filename, (.previous_filename // empty)')"
        # The files API stops at 3000 files: past that, run everything.
        if [ "$CHANGED_FILES" -ge 3000 ] || grep -Eq "$ci_paths" <<<"$files"; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Go change: the Go jobs are skipped."
          echo "go=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        EVENT: ${{ github.event_name }}
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHANGED_FILES: ${{ github.event.pull_request.changed_files }}

  lint:
    name: GolangCI Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          # The action tracks golangci-lint `latest`, so new checks can appear
          # without any code change and flag pre-existing debt. Gate PRs on the
          # issues they actually introduce; pre-existing findings are paid down
          # separately rather than blocking every PR.
          only-new-issues: true

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - run: go mod download
    - run: go build -v .

  generate:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - run: go generate ./...
    - name: git diff
      run: |
        git diff --compact-summary --exit-code || \
          (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)
  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: true
    - run: go mod download

    - name: Unit tests
      if: always()
      # -race requires cgo; the coverage profile feeds Codecov below.
      run: go tool gotestsum --junitfile junit.xml -- -coverprofile=coverage.txt -covermode=atomic -race -count=1 -timeout 120m -v ./...
      env:
        CGO_ENABLED: "1"

    - name: Generate HTML coverage report
      if: always()
      run: go tool cover -html=coverage.txt -o coverage.html

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage.txt
          coverage.html
          junit.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        use_oidc: true
        flags: unit

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        flags: unit

# Autogenerated by https://github.com/appkins/ecu/github
#
# Bot PRs used to get `gh pr merge --auto`, which merges at once because `main`
# has no required status checks (#486). Now PRs that CI/CD runs on are only
# labelled `automerge`; dependabot-automerge.yml merges them after CI/CD is
# green. pull_request_target has a write token: never check out PR code here.

name: Bot PR Auto-Approve
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.actor == 'dependabot[bot]' ||
        github.actor == 'copilot[bot]' &&
        github.event.pull_request.user.login == 'copilot[bot]' &&
        github.event.pull_request.user.type == 'Bot'
      }}
    steps:
      - name: Dependabot metadata
        if: ${{github.actor == 'dependabot[bot]'}}
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve a PR
        if: >-
          ${{
            github.actor != 'dependabot[bot]' ||
            steps.metadata.outputs.update-type != 'version-update:semver-major'
          }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Remove a stale automerge label from a major update
        if: >-
          ${{
            github.actor == 'dependabot[bot]' &&
            steps.metadata.outputs.update-type == 'version-update:semver-major'
          }}
        run: |
          set -euo pipefail
          labelled="$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | index("automerge") != null')"
          if [ "$labelled" = "true" ]; then
            echo "Semver-major update: removing the automerge label."
            gh pr edit "$PR_URL" --remove-label automerge
          else
            echo "Semver-major update: no automerge label to remove."
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Merge now, or label for merge after CI/CD
        if: >-
          ${{
            github.actor != 'dependabot[bot]' ||
            steps.metadata.outputs.update-type != 'version-update:semver-major'
          }}
        run: |
          set -euo pipefail
          label() {
            echo "$1: labelling it; dependabot-automerge.yml merges it once CI/CD is green."
            gh label create automerge --repo "$GH_REPO" --force \
              --color 0e8a16 --description "Bot PR: merge after CI/CD succeeds (see dependabot-automerge.yml)"
            gh api --silent -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f 'labels[]=automerge'
          }

          # The paths filter only sees a PR's first 300 files, and the files API
          # stops at 3000: never merge a PR that large without CI/CD.
          if [ "$CHANGED_FILES" -ge 300 ]; then
            label "PR changes $CHANGED_FILES files, too many to rule out CI/CD"
            exit 0
          fi

          # Mirrors the `paths:` filter of the pull_request trigger in ci.yaml.
          # Keep the two in sync: a path CI/CD runs on but this misses would be
          # merged without waiting for CI. A rename counts under both names.
          ci_paths='(\.go$)|(^go\.mod$)|(^go\.sum$)|(^\.github/workflows/ci\.yaml$)'
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          # A here-string, not `printf | grep -q`: grep exits at the first match,
          # and under pipefail the writer's SIGPIPE (141) would read as no match.
          if grep -Eq "$ci_paths" <<<"$files"; then
            label "CI/CD runs on this PR"
          else
            echo "No file matches CI/CD's paths filter, so CI/CD will not run: merging now."
            gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          HEAD_SHA: ${{github.event.pull_request.head.sha}}
          CHANGED_FILES: ${{github.event.pull_request.changed_files}}
          GH_REPO: ${{github.repository}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

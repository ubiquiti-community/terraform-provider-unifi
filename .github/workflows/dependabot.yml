# Autogenerated by https://github.com/appkins/ecu/github
#
# Bot PRs used to get `gh pr merge --auto`, which merged at once while `main`
# had no required status checks (#486). Now every bot PR is only labelled
# `automerge`; dependabot-automerge.yml merges it after CI/CD is green. CI/CD
# runs on every PR and reports the required Build and test checks, so there is
# no PR to merge before it. pull_request_target has a write token: never check
# out PR code here.

name: Bot PR Auto-Approve
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.actor == 'dependabot[bot]' ||
        github.actor == 'copilot[bot]' &&
        github.event.pull_request.user.login == 'copilot[bot]' &&
        github.event.pull_request.user.type == 'Bot'
      }}
    steps:
      - name: Dependabot metadata
        if: ${{github.actor == 'dependabot[bot]'}}
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve a PR
        if: >-
          ${{
            github.actor != 'dependabot[bot]' ||
            steps.metadata.outputs.update-type != 'version-update:semver-major'
          }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Remove a stale automerge label from a major update
        if: >-
          ${{
            github.actor == 'dependabot[bot]' &&
            steps.metadata.outputs.update-type == 'version-update:semver-major'
          }}
        run: |
          set -euo pipefail
          labelled="$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | index("automerge") != null')"
          if [ "$labelled" = "true" ]; then
            echo "Semver-major update: removing the automerge label."
            gh pr edit "$PR_URL" --remove-label automerge
          else
            echo "Semver-major update: no automerge label to remove."
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Label for merge after CI/CD
        if: >-
          ${{
            github.actor != 'dependabot[bot]' ||
            steps.metadata.outputs.update-type != 'version-update:semver-major'
          }}
        run: |
          set -euo pipefail
          echo "Labelling it; dependabot-automerge.yml merges it once CI/CD is green."
          gh label create automerge --repo "$GH_REPO" --force \
            --color 0e8a16 --description "Bot PR: merge after CI/CD succeeds (see dependabot-automerge.yml)"
          gh api --silent -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f 'labels[]=automerge'
        env:
          PR_NUMBER: ${{github.event.pull_request.number}}
          GH_REPO: ${{github.repository}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
